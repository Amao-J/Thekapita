<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>theKapita. — Authentication Portal</title>

  <!-- SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%23121212'/><text x='32' y='68' font-family='sans-serif' font-weight='800' font-size='52' fill='%23ffffff'>K</text><circle cx='72' cy='64' r='7' fill='%2300d084'/></svg>">

  <!-- Google Fonts Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <!-- Brand Banner Header -->
    <header class="auth-header">
      <a href="index.html" class="logo-container logo-link" aria-label="theKapita - Return to Homepage">
        <h1 class="brand-title">
          <span class="prefix">the</span>Kapita<span class="dot">.</span>
        </h1>
      </a>
      <p class="auth-subtitle">One App. One Identity. One Wallet</p>
    </header>

    <!-- Auth Card Container -->
    <main class="kapita-card auth-card" id="main-content">
      
      <!-- Toggle Tabs -->
      <div class="auth-tabs" role="tablist" aria-label="Authentication Options">
        <button type="button" role="tab" aria-selected="true" aria-controls="signInForm" id="tabSignIn" class="auth-tab-btn active" onclick="switchAuthMode('signin')">Sign In</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="signUpForm" id="tabSignUp" class="auth-tab-btn" tabindex="-1" onclick="switchAuthMode('signup')">Create Account</button>
      </div>

      <!-- FORM 1: SIGN IN -->
      <form id="signInForm" role="tabpanel" aria-labelledby="tabSignIn" class="auth-form active" tabindex="0">
        <p id="signInError" class="auth-error" role="alert" hidden></p>
        
        <div class="form-group">
          <label for="signinIdentifier">Email or theKapita ID</label>
          <input type="text" id="signinIdentifier" name="identifier" placeholder="e.g. name@example.com or KPT-883902" class="form-control" autocomplete="username" required />
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="signinPassword">Password</label>
            <a href="#" class="forgot-link" onclick="alert('Password reset link sent to your registered email.'); return false;">Forgot?</a>
          </div>
          <div class="password-input-wrapper">
            <input type="password" id="signinPassword" name="password" placeholder="••••••••" class="form-control" autocomplete="current-password" required />
            <button type="button" class="eye-btn" onclick="togglePasswordVisibility('signinPassword', this)" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle class="eye-open" cx="12" cy="12" r="3"/>
                <path class="eye-closed" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22" style="display: none;"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label for="rememberDevice" class="remember-me">
            <input type="checkbox" id="rememberDevice" name="remember" checked />
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="btn-primary w-full btn-auth">Sign In</button>
      </form>

      <!-- FORM 2: SIGN UP -->
      <form id="signUpForm" role="tabpanel" aria-labelledby="tabSignUp" class="auth-form" tabindex="0" hidden>
        <p id="signUpError" class="auth-error" role="alert" hidden></p>

        <div class="form-group">
          <label for="signupFullName">Full Legal Name</label>
          <input type="text" id="signupFullName" name="fullName" placeholder="e.g. Ahmed Ebuka" class="form-control" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" name="email" placeholder="ahmed@example.com" class="form-control" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="signupPhone">Phone Number</label>
          <input type="tel" id="signupPhone" name="phone" placeholder="+234 810 000 0000" class="form-control" autocomplete="tel" required />
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="signupPassword" name="newPassword" placeholder="Minimum 8 characters" class="form-control" minlength="8" autocomplete="new-password" required />
            <button type="button" class="eye-btn" onclick="togglePasswordVisibility('signupPassword', this)" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle class="eye-open" cx="12" cy="12" r="3"/>
                <path class="eye-closed" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22" style="display: none;"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label for="agreeTerms" class="remember-me">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
            <span>I agree to the <a href="#" class="inline-link">Terms of Service</a> &amp; <a href="#" class="inline-link">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn-primary w-full btn-auth">Create Account</button>
      </form>

      <!-- Social / Quick Connect Divider -->
      <div class="auth-divider">
        <span>OR CONNECT WITH</span>
      </div>

      <div class="social-auth-grid">
        <button type="button" class="social-btn" onclick="handleSocialConnect('Google')" aria-label="Sign in with Google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.1 0-5.74-2.09-6.68-4.91H1.32v3.13C3.3 21.36 7.39 24 12 24z"/><path fill="#FBBC05" d="M5.32 14.27c-.24-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.6H1.32C.48 8.28 0 10.08 0 12s.48 3.72 1.32 5.4l4-3.13z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.39 0 3.3 2.64 1.32 6.6l4 3.13c.94-2.82 3.58-4.98 6.68-4.98z"/></svg>
          Google
        </button>
        <button type="button" class="social-btn" onclick="handleSocialConnect('Apple')" aria-label="Sign in with Apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#121212" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 .6-2.65 1.36-.58.67-1.08 1.75-.94 2.78 1.01.08 2.04-.52 2.66-1.29z"/></svg>
          Apple
        </button>
      </div>

    </main>
  </div>

  <script type="module" src="src/pages/auth.js"></script>
</body>
</html>
