<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>theKapita | Trip Complete & Receipt</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%23121212'/><text x='32' y='68' font-family='sans-serif' font-weight='800' font-size='52' fill='%23ffffff'>K</text><circle cx='72' cy='64' r='7' fill='%2300d084'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ride.css">
</head>
<body class="ride-page-body">

  <a href="#main-content" class="skip-to-main">Skip to main content</a>

  <main id="main-content" class="ride-main-container" tabindex="-1">
    <div class="ride-content-wrapper" style="text-align: center; max-width: 440px; margin: 0 auto;">

      <!-- Success Check Icon -->
      <div style="width: 64px; height: 64px; background: #e6fdf4; color: #008a57; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;" aria-hidden="true">
        <span class="material-symbols-outlined" style="font-size: 36px;">check_circle</span>
      </div>

      <h1 style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 4px;">You Have Arrived!</h1>
      <p style="font-size: 13px; color: #475569; margin-bottom: 24px;">Trip completed successfully with Emeka Okafor</p>

      <!-- Rating Star Selector -->
      <div class="active-shipment-card" style="margin-bottom: 20px;">
        <label for="driverFeedback" style="font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #0f172a; display: block;">Rate your Driver</label>
        <div style="display: flex; justify-content: center; gap: 8px; font-size: 28px; color: #d97706; cursor: pointer; margin-bottom: 16px;" role="radiogroup" aria-label="5 star rating system">
          ★ ★ ★ ★ ★
        </div>
        <textarea id="driverFeedback" class="form-control" rows="3" placeholder="Add a compliment or tip feedback (optional)..."></textarea>
      </div>

      <!-- Paid Receipt Summary Card -->
      <div class="fare-calculation-summary" style="margin-bottom: 24px; text-align: left;" aria-label="Trip Receipt Summary">
        <div class="summary-row"><span>Base Fare:</span><strong>₦1,800.00</strong></div>
        <div class="summary-row"><span>Tolls & Distance:</span><strong>₦400.00</strong></div>
        <div class="dropdown-divider" role="separator"></div>
        <div class="summary-row highlight">
          <span>Paid via Kapita Wallet:</span>
          <strong style="color: #008a57;">₦2,200.00</strong>
        </div>
      </div>

      <button type="button" class="confirm-service-btn" onclick="window.location.href='ride.html'">
        Done & Back to Home
      </button>

    </div>
  </main>
</body>
</html>
