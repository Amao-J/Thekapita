<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>theKapita | Trip in Progress</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%23121212'/><text x='32' y='68' font-family='sans-serif' font-weight='800' font-size='52' fill='%23ffffff'>K</text><circle cx='72' cy='64' r='7' fill='%2300d084'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ride.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="ride-page-body">

  <a href="#main-content" class="skip-to-main">Skip to main content</a>

  <!-- Header -->
  <header class="desktop-header profile-back-header" role="banner">
    <div class="header-back-action" onclick="window.location.href='ride.html'" tabindex="0" role="button" aria-label="Return to ride home" onkeydown="if(event.key==='Enter'||event.key===' ') window.location.href='ride.html'">
      <div class="back-btn-circle"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></div>
      <span style="font-weight: 700; font-size: 16px;">theKapita <span style="color: #008a57;">Live Ride</span></span>
    </div>
    <div id="rideStatusBadge" class="status-badge live" role="status" aria-live="polite"><span class="pulse-dot" aria-hidden="true"></span> REQUEST SUBMITTED</div>
  </header>

  <main id="main-content" class="ride-main-container" tabindex="-1">
    <div class="ride-content-wrapper">

      <!-- Live map: shows pickup, destination and (once assigned) the driver's position -->
      <div class="gps-map-container" style="border-radius: 20px; height: 300px; position: relative; overflow: hidden; margin-bottom: 20px; border: 1px solid #334155;" role="region" aria-label="Live ride map">
        <div id="rideMap" style="position:absolute; inset:0;"></div>
        <div style="position:absolute; left:12px; right:12px; bottom:12px; z-index:500; background:rgba(15,23,42,.88); color:#fff; border-radius:12px; padding:10px 14px; display:flex; align-items:center; gap:8px;">
          <span class="material-symbols-outlined" style="font-size: 22px; color: #00d084;" aria-hidden="true">near_me</span>
          <p id="rideRequestStatus" style="font-size: 12px; font-weight: 600; margin:0;">Loading ride request…</p>
        </div>
      </div>

      <!-- Driver details appear after a driver has accepted the request. -->
      <div class="active-shipment-card" style="margin-bottom: 20px;">
        <div class="courier-driver-box" style="margin-bottom: 0;">
          <div class="driver-details">
            <h2 id="rideType">Ride</h2>
            <p>Reference: <span id="rideRequestReference"></span></p>
          </div>
          <div id="rideDriverDetails" class="driver-details" hidden>
            <p><strong id="rideDriverName"></strong></p>
            <p id="rideDriverVehicle"></p>
            <a id="rideDriverPhone" class="driver-call-btn" aria-label="Call assigned driver">
              <span class="material-symbols-outlined" aria-hidden="true">call</span>
            </a>
          </div>
        </div>
      </div>

      <!-- Rider PIN: the driver must type this to start the trip -->
      <div id="rideOtpBox" class="active-shipment-card" style="margin-bottom: 20px; text-align:center;" hidden>
        <p style="font-size: 12px; color: #475569; margin-bottom: 4px;">Share this PIN with your driver to start the trip</p>
        <strong id="rideOtp" style="font-size: 30px; letter-spacing: 8px; color:#0f172a;">----</strong>
      </div>

      <!-- Route Details Card -->
      <div class="location-picker-card" style="margin-bottom: 20px;">
        <div class="route-line-connector" aria-hidden="true">
          <span class="dot origin"></span>
          <span class="line"></span>
          <span class="dot destination"></span>
        </div>
        <div class="inputs-column">
          <div class="input-row" style="background: transparent; border: none; padding: 0;">
            <div style="font-size: 12px; color: #475569;">Pickup: <strong id="ridePickup"></strong></div>
          </div>
          <div class="input-row" style="background: transparent; border: none; padding: 0;">
            <div style="font-size: 12px; color: #0f172a;">Dropoff: <strong id="rideDestination"></strong></div>
          </div>
        </div>
      </div>

      <!-- Payment & Fare Breakdown -->
      <div class="fare-calculation-summary" style="margin-bottom: 20px;">
        <div class="summary-row">
          <span>Status:</span>
          <strong id="rideFareStatus">Charged when a driver is assigned</strong>
        </div>
        <div class="summary-row highlight">
          <span>Total Fare:</span>
          <strong id="rideFare" style="color: #008a57;"></strong>
        </div>
      </div>

      <button type="button" id="cancelRideRequestBtn" class="confirm-service-btn" onclick="cancelActiveRideRequest()">
        Cancel Ride Request
      </button>

    </div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="src/pages/ride.js"></script>
</body>
</html>
